# Balance de Migajaland: la red cubre animales y criaturas pequenas; la jaula
# cubre recursos comunes y el cristal cubre criaturas peligrosas. Los jefes,
# evokers, brujas, aldeanos, NPC de MCA, chocobos, mascotas y mobs de mods
# quedan fuera. La bruja conserva su obtencion normal porque End Remastered
# añade a su botin un material de progresion que no debe automatizarse.
EnduringCaptureNet\:Enabled=true
EnduringCaptureNet\:MaxDurability=64
EnduringCaptureNet\:MaxEntityHeightToCapture=1.4
EnduringCaptureNet\:MaxEntityWidthToCapture=0.9
EnduringCaptureNet\:RequiredHealthPercentageToCapture=0.5
EnduringCaptureNet\:AllowList=minecraft\:chicken,minecraft\:cow,minecraft\:pig,minecraft\:sheep,minecraft\:rabbit,minecraft\:goat,minecraft\:mooshroom,minecraft\:spider,minecraft\:cave_spider,minecraft\:slime,minecraft\:magma_cube
EnduringCaptureNet\:DenyList=minecraft\:wither,minecraft\:ender_dragon,minecraft\:warden,minecraft\:elder_guardian,minecraft\:evoker,minecraft\:witch
IronboundContainmentCage\:Enabled=true
IronboundContainmentCage\:MaxDurability=32
IronboundContainmentCage\:MaxEntityHeightToCapture=2.0
IronboundContainmentCage\:MaxEntityWidthToCapture=1.5
IronboundContainmentCage\:RequiredHealthPercentageToCapture=0.25
IronboundContainmentCage\:AllowList=minecraft\:chicken,minecraft\:cow,minecraft\:pig,minecraft\:sheep,minecraft\:rabbit,minecraft\:goat,minecraft\:mooshroom,minecraft\:zombie,minecraft\:skeleton,minecraft\:spider,minecraft\:cave_spider,minecraft\:creeper,minecraft\:blaze,minecraft\:slime,minecraft\:magma_cube,minecraft\:husk,minecraft\:stray,minecraft\:drowned,minecraft\:pillager,minecraft\:endermite,minecraft\:hoglin,minecraft\:piglin,minecraft\:zombified_piglin
IronboundContainmentCage\:DenyList=minecraft\:wither,minecraft\:ender_dragon,minecraft\:warden,minecraft\:elder_guardian,minecraft\:evoker,minecraft\:witch
MysticBindingCrystal\:Enabled=true
MysticBindingCrystal\:MaxDurability=32
MysticBindingCrystal\:MaxEntityHeightToCapture=4.0
MysticBindingCrystal\:MaxEntityWidthToCapture=3.0
MysticBindingCrystal\:RequiredHealthPercentageToCapture=0.25
MysticBindingCrystal\:AllowList=minecraft\:chicken,minecraft\:cow,minecraft\:pig,minecraft\:sheep,minecraft\:rabbit,minecraft\:goat,minecraft\:mooshroom,minecraft\:zombie,minecraft\:skeleton,minecraft\:spider,minecraft\:cave_spider,minecraft\:creeper,minecraft\:blaze,minecraft\:slime,minecraft\:magma_cube,minecraft\:husk,minecraft\:stray,minecraft\:drowned,minecraft\:enderman,minecraft\:phantom,minecraft\:ghast,minecraft\:guardian,minecraft\:pillager,minecraft\:vindicator,minecraft\:ravager,minecraft\:shulker,minecraft\:wither_skeleton,minecraft\:endermite,minecraft\:iron_golem,minecraft\:hoglin,minecraft\:zoglin,minecraft\:piglin,minecraft\:piglin_brute,minecraft\:zombified_piglin
MysticBindingCrystal\:DenyList=minecraft\:wither,minecraft\:ender_dragon,minecraft\:warden,minecraft\:elder_guardian,minecraft\:evoker,minecraft\:witch
VoidBindingChain\:Enabled=false
VoidBindingChain\:MaxDurability=16
VoidBindingChain\:MaxEntityHeightToCapture=6.0
