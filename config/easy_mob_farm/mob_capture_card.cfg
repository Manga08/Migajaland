# Balance de Migajaland: animales y criaturas vanilla utiles pueden entregar
# tarjetas. La probabilidad es la predeterminada y equilibrada del mod (10 %):
# exige muerte directa por jugador, no funciona pescando y la tarjeta obtenida
# es reutilizable. Jefes, brujas, NPC, mascotas y criaturas de mods quedan fuera.
dropMobCaptureCardOnFishing=false
dropMobCaptureCardOnKill=true
mobCaptureCardFishingDropChance=0.0
mobCaptureCardFoilDropChance=0.01
mobCaptureCardKillDropChance=0.1
requirePlayerKill=true
mobCaptureCardKillDropAllowList=minecraft\:chicken,minecraft\:cow,minecraft\:pig,minecraft\:sheep,minecraft\:rabbit,minecraft\:goat,minecraft\:mooshroom,minecraft\:zombie,minecraft\:skeleton,minecraft\:spider,minecraft\:cave_spider,minecraft\:creeper,minecraft\:blaze,minecraft\:slime,minecraft\:magma_cube,minecraft\:husk,minecraft\:stray,minecraft\:drowned,minecraft\:enderman,minecraft\:phantom,minecraft\:ghast,minecraft\:guardian,minecraft\:pillager,minecraft\:vindicator,minecraft\:ravager,minecraft\:shulker,minecraft\:wither_skeleton,minecraft\:endermite,minecraft\:iron_golem,minecraft\:hoglin,minecraft\:zoglin,minecraft\:piglin,minecraft\:piglin_brute,minecraft\:zombified_piglin
mobCaptureCardKillDropDenyList=minecraft\:wither,minecraft\:ender_dragon,minecraft\:warden,minecraft\:elder_guardian,minecraft\:evoker,minecraft\:witch
mobCaptureCardFishingDropAllowList=
