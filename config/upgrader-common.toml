valueOverrides = ["too_many_bows:demons_grasp=12000", "too_many_bows:hunter_bow=12000", "too_many_bows:fletchers_talisman=16000", "too_many_bows:torchbearer=16000", "too_many_bows:aethers_call=16000", "too_many_bows:emerald_sage_bow=24000", "too_many_bows:ironclad_bow=24000", "too_many_bows:tidal_bow=36000", "too_many_bows:cyroheart_bow=36000", "too_many_bows:arcane_bow=50000", "too_many_bows:sentinels_wrath=50000", "too_many_bows:sharpshot_ring=50000", "too_many_bows:ancient_sage_bow=80000", "too_many_bows:burnt_relic=80000", "too_many_bows:webstring=80000", "too_many_bows:verdant_viper=120000", "too_many_bows:scatter_bow=120000", "too_many_bows:solar_bow=120000", "too_many_bows:dead_eyes_pendant=120000", "too_many_bows:frostbite=270000", "too_many_bows:wind_bow=270000", "too_many_bows:vitality_weaver=390000", "too_many_bows:radiance=390000", "too_many_bows:wind_glove=390000", "too_many_bows:cursed_stone=450000", "too_many_bows:arc_heavens=540000", "too_many_bows:flame_bow=540000", "too_many_bows:ethereal_hunter=540000", "too_many_bows:stormbound_signet=540000", "too_many_bows:verdant_vigor=750000", "too_many_bows:dragons_breath=750000", "too_many_bows:shulker_blast=750000", "too_many_bows:astral_bound=1050000", "too_many_bows:spectral_whisper=1050000", "too_many_bows:twin_shadows=1050000", "too_many_bows:crimson_nexus=1800000", "too_many_bows:dark_bow=1800000", "too_many_bows:necro_flame_bow=1800000", "too_many_bows:auroras_grace=3000000", "too_many_bows:dusk_reaper=3000000"]
#Multiplies every item's price, valueOverrides included. 1.0 leaves them alone, 2.0 doubles every number the mod shows or rolls against.
# Default: 1.0
# Range: 0.01 ~ 1000.0
globalValueMultiplier = 1.0
#Per-item multipliers on top of globalValueMultiplier, format 'modid:item=factor'. 2.0 makes that one item's price twice what the rest of the config would give it.
valueMultipliers = []
#Items that can never be used as an input or picked as a target.
blacklist = []
#Most target items one upgrade may ask for. The item's own stack size still applies.
# Default: 64
# Range: 1 ~ 64
maxTargetCount = 16
#Attempts a player gets per window. 0 removes the limit.
# Default: 0
# Range: 0 ~ 10000
attemptLimit = 20
#Length of that window in seconds. 0 removes the limit.
# Default: 0
# Range: 0 ~ 86400
attemptWindowSeconds = 600
