#Multiplier applied to the raw value ratio. 1.0 = fair odds, 0.9 = 10% house edge.
# Default: 0.9
# Range: 0.01 ~ 1.0
houseEdge = 0.9
#Lowest possible success chance (0.001 = 0.1%).
# Default: 0.001
# Range: 0.0 ~ 1.0
minChance = 1.0E-6
#Highest possible success chance. Keeps 'downgrades' from being a free win.
# Default: 0.9
# Range: 0.01 ~ 1.0
maxChance = 0.9
#How long the wheel spins before the result is applied, in ticks (20 = 1 second).
# Default: 70
# Range: 20 ~ 600
spinDurationTicks = 60
#Hard-coded item values, format 'modid:item=value'. These win over the built-in table.
valueOverrides = ["too_many_bows:demons_grasp=6000", "too_many_bows:hunter_bow=6000", "too_many_bows:torchbearer=8000", "too_many_bows:aethers_call=8000", "too_many_bows:emerald_sage_bow=12000", "too_many_bows:ironclad_bow=12000", "too_many_bows:tidal_bow=18000", "too_many_bows:cyroheart_bow=18000", "too_many_bows:arcane_bow=25000", "too_many_bows:sentinels_wrath=25000", "too_many_bows:ancient_sage_bow=40000", "too_many_bows:burnt_relic=40000", "too_many_bows:webstring=40000", "too_many_bows:verdant_viper=60000", "too_many_bows:scatter_bow=60000", "too_many_bows:solar_bow=60000", "too_many_bows:frostbite=90000", "too_many_bows:wind_bow=90000", "too_many_bows:vitality_weaver=130000", "too_many_bows:radiance=130000", "too_many_bows:arc_heavens=180000", "too_many_bows:flame_bow=180000", "too_many_bows:ethereal_hunter=180000", "too_many_bows:verdant_vigor=250000", "too_many_bows:dragons_breath=250000", "too_many_bows:shulker_blast=250000", "too_many_bows:astral_bound=350000", "too_many_bows:spectral_whisper=350000", "too_many_bows:twin_shadows=350000", "too_many_bows:crimson_nexus=600000", "too_many_bows:dark_bow=600000", "too_many_bows:necro_flame_bow=600000", "too_many_bows:auroras_grace=1000000", "too_many_bows:dusk_reaper=1000000"]
#Multiplies every item's price, valueOverrides included. 1.0 leaves them alone, 2.0 doubles every number the mod shows or rolls against.
# Default: 1.0
# Range: 0.01 ~ 1000.0
globalValueMultiplier = 1.0
#Per-item multipliers on top of globalValueMultiplier, format 'modid:item=factor'. 2.0 makes that one item's price twice what the rest of the config would give it.
valueMultipliers = []
#Items that can never be used as an input or picked as a target.
blacklist = []
#Most target items one upgrade may ask for. The item's own stack size still applies.
# Default: 64
# Range: 1 ~ 64
maxTargetCount = 16
#Attempts a player gets per window. 0 removes the limit.
# Default: 0
# Range: 0 ~ 10000
attemptLimit = 20
#Length of that window in seconds. 0 removes the limit.
# Default: 0
# Range: 0 ~ 86400
attemptWindowSeconds = 600
