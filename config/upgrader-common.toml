#Multiplier applied to the raw value ratio. 1.0 = fair odds, 0.9 = 10% house edge.
# Default: 0.9
# Range: 0.01 ~ 1.0
houseEdge = 0.9
#Lowest possible success chance (0.001 = 0.1%).
# Default: 0.001
# Range: 0.0 ~ 1.0
minChance = 1.0E-6
#Highest possible success chance. Keeps 'downgrades' from being a free win.
# Default: 0.9
# Range: 0.01 ~ 1.0
maxChance = 0.9
#How long the wheel spins before the result is applied, in ticks (20 = 1 second).
# Default: 70
# Range: 20 ~ 600
spinDurationTicks = 60
